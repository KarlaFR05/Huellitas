name: huellitas
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+6

environment:
  sdk: ^3.12.1

dependencies:
  intl: ^0.18.1
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  permission_handler: ^11.0.1 # Para permisos de cámara/galería

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  get_it: ^9.2.1
  dio: ^5.9.2
  equatable: ^2.0.8
  geolocator: ^14.0.3
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/insignias/donacion/
    - assets/images/insignias/reporte/
    - assets/images/insignias/rescate/
    - assets/images/avatares/

#Para generar el icono de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#57C29A" # tu color primario, se usa de fondo en Android 8+
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"
